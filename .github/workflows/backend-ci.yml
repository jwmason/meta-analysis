name: Deploy FastAPI Backend to Azure App Service with Docker

on:
  push:
    branches:
      - be1-api-and-scibert  # Adjust to your branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Azure Container Registry (ACR)
        run: |
          az acr login --name metaanalysisacr

      - name: Set Docker Image Tag
        run: echo "IMAGE_TAG=metaanalysisacr.azurecr.io/meta-analysis-backend:latest" >> $GITHUB_ENV

      - name: Build Docker Image
        run: |
          docker build -t $IMAGE_TAG ./be1-api-and-scibert

      - name: Push Docker Image to ACR
        run: |
          docker push $IMAGE_TAG

      - name: Deploy to Azure App Service (Container)
        run: |
          az webapp config container set \
            --name meta-analysis-backend \
            --resource-group meta-analysis-resource-group \
            --docker-custom-image-name $IMAGE_TAG \
            --docker-registry-server-url https://metaanalysisacr.azurecr.io

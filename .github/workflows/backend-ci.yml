name: Deploy FastAPI Backend to Azure App Service with Docker (Admin Credentials Pre-Configured)

on:
  push:
    branches:
      - main # Adjust to your actual branch if needed

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Azure Container Registry (ACR)
        run: |
          az acr login --name metaanalysisacr

      - name: Set Docker Image Tag
        run: |
          echo "IMAGE_TAG=metaanalysisacr.azurecr.io/meta-analysis-backend:latest" >> $GITHUB_ENV

      - name: Build Docker Image (from be1-api-and-scibert folder)
        run: |
          docker build -t $IMAGE_TAG ./be1-api-and-scibert

      - name: Push Docker Image to ACR
        run: |
          docker push $IMAGE_TAG

      - name: Restart App Service (to pull latest image)
        run: |
          az webapp restart \
            --name meta-analysis-backend \
            --resource-group meta-analysis-resource-group


name: Deploy FastAPI Backend to Azure App Service

on:
  push:
    branches:
      - be1-api-and-scibert  # Adjust if needed

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Package application files (exclude unnecessary files)
        run: |
          cd be1-api-and-scibert  # Adjust if your FastAPI app is inside this folder
          zip -r ../release.zip . -x "*.git*" "*.venv*" "__pycache__*" "*.DS_Store*"

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Configure Azure App Service Settings (Enable build on deploy)
        run: |
          az webapp config appsettings set \
            --name meta-analysis-backend \
            --resource-group meta-analysis-resource-group \
            --settings SCM_DO_BUILD_DURING_DEPLOYMENT=true \
                       WEBSITES_PORT=8000

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: meta-analysis-backend
          package: release.zip
          clean: true  # Removes old files before deploying

      - name: Set FastAPI Startup Command
        run: |
          az webapp config set \
            --name meta-analysis-backend \
            --resource-group meta-analysis-resource-group \
            --startup-file "gunicorn -w 4 -k uvicorn.workers.UvicornWorker -b 0.0.0.0:8000 main:app"
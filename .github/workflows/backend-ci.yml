name: Deploy FastAPI Backend to Azure App Service

on:
  push:
    branches:
      - be1-api-and-scibert  # Adjust this if needed

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Package application files (do not include the parent folder)
        run: |
          cd be1-api-and-scibert
          zip -r ../release.zip . -x "*.git*" "*.venv*" "__pycache__*"

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Clear Azure App Service Environment and Cache
        run: |
          az webapp stop \
            --name meta-analysis-backend \
            --resource-group meta-analysis-resource-group

          az webapp config appsettings set \
            --name meta-analysis-backend \
            --resource-group meta-analysis-resource-group \
            --settings SCM_DO_BUILD_DURING_DEPLOYMENT=true

          az webapp start \
            --name meta-analysis-backend \
            --resource-group meta-analysis-resource-group

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: meta-analysis-backend
          package: release.zip
          clean: true  # Force full redeploy (removes old files)

      - name: Set Startup Command
        run: |
          az webapp config set \
            --resource-group meta-analysis-resource-group \
            --name meta-analysis-backend \
            --startup-file "bash /home/site/wwwroot/startup.sh"

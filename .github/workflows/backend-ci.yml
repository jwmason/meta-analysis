name: Deploy FastAPI Backend to Azure App Service with Docker (Admin Credentials)

on:
  push:
    branches:
      - be1-api-and-scibert  # Adjust to your branch if needed

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Azure Container Registry (ACR)
        run: |
          az acr login --name metaanalysisacr

      - name: Set Docker Image Tag
        run: |
          echo "IMAGE_TAG=metaanalysisacr.azurecr.io/meta-analysis-backend:latest" >> $GITHUB_ENV

      - name: Build Docker Image (from be1-api-and-scibert folder)
        run: |
          docker build -t $IMAGE_TAG ./be1-api-and-scibert

      - name: Push Docker Image to ACR
        run: |
          docker push $IMAGE_TAG

      - name: Get ACR Credentials
        id: acr-creds
        run: |
          ACR_USERNAME=$(az acr credential show --name metaanalysisacr --query "username" -o tsv)
          ACR_PASSWORD=$(az acr credential show --name metaanalysisacr --query "passwords[0].value" -o tsv)

          echo "ACR_USERNAME=$ACR_USERNAME" >> $GITHUB_ENV
          echo "ACR_PASSWORD=$ACR_PASSWORD" >> $GITHUB_ENV

      - name: Stop App Service (to clear .NET Core container)
        run: |
          az webapp stop \
            --name meta-analysis-backend \
            --resource-group meta-analysis-resource-group

      - name: Configure App Service to Use ACR Image with Admin Credentials
        run: |
          az webapp config container set \
            --name meta-analysis-backend \
            --resource-group meta-analysis-resource-group \
            --docker-custom-image-name $IMAGE_TAG \
            --docker-registry-server-url https://metaanalysisacr.azurecr.io \
            --docker-registry-server-user $ACR_USERNAME \
            --docker-registry-server-password $ACR_PASSWORD

      - name: Start App Service
        run: |
          az webapp start \
            --name meta-analysis-backend \
            --resource-group meta-analysis-resource-group

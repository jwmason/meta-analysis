name: Deploy FastAPI Backend to Azure App Service

on:
  push:
    branches:
      - be1-api-and-scibert  # Update to match your branch name

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Package FastAPI Application Files
        run: |
          cd be1-api-and-scibert  # Adjust this if your FastAPI code is inside this folder
          zip -r ../release.zip . -x "*.git*" "*.venv*" "__pycache__*" "*.DS_Store*"

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Configure App Service (Set Environment Variables)
        run: |
          az webapp config appsettings set \
            --name meta-analysis-backend \
            --resource-group meta-analysis-resource-group \
            --settings SCM_DO_BUILD_DURING_DEPLOYMENT=true \
                       WEBSITES_PORT=8000

      - name: Deploy FastAPI App to Azure App Service
        uses: azure/webapps-deploy@v2
        with:
          app-name: meta-analysis-backend
          package: release.zip

      - name: Set Startup Command to Install Dependencies and Start App
        run: |
          az webapp config set \
            --name meta-analysis-backend \
            --resource-group meta-analysis-resource-group \
            --startup-file "python -m pip install --no-cache-dir -r requirements.txt && gunicorn -w 4 -k uvicorn.workers.UvicornWorker -b 0.0.0.0:8000 main:app"

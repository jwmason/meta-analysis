name: Build and deploy Python FastAPI app to Azure Web App - meta-analysis-backend

on:
  push:
    branches:
      - be1-api-and-scibert
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Free up disk space before installation
        run: |
          echo "Disk space before cleanup:"
          df -h
          sudo apt-get clean
          sudo apt-get autoremove -y
          sudo rm -rf /var/lib/apt/lists/*
          sudo docker system prune -a -f
          sudo rm -rf /tmp/*
          echo "Disk space after cleanup:"
          df -h

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies with cleanup
        run: |
          python -m pip install --upgrade pip
          cd be1-api-and-scibert
          pip install --no-cache-dir -r requirements.txt  # Prevents caching large dependencies

      - name: Check disk usage after dependencies installation
        run: df -h

      - name: Zip artifact for deployment
        run: |
          cd be1-api-and-scibert
          zip -r ../release.zip .

      - name: List contents of release.zip
        run: unzip -l release.zip  

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      - name: Download artifact from build
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Unzip artifact
        run: |
          unzip release.zip
          ls -R  

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'meta-analysis-backend'
          slot-name: 'Production'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_B3A45F38AF394FC7B9A4519038E50C03 }}
